services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ***REMOVED***
      MYSQL_DATABASE: lockmaster
      MYSQL_USER: lockmaster
      MYSQL_PASSWORD: ***REMOVED***
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulockmaster", "-p***REMOVED***"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # El APP_SECRET viene de .env.local, que no se versiona. Si el fichero no
    # está, la app arranca con el placeholder de .env: solo vale para desarrollo.
    env_file:
      - path: .env.local
        required: false
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://lockmaster:***REMOVED***@db:3306/lockmaster?serverVersion=8.0&charset=utf8mb4"
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      JWT_PASSPHRASE: lockmaster
      DB_HOST: db
      DB_USER: lockmaster
      DB_PASSWORD: ***REMOVED***
      LOAD_FIXTURES: "1"
    ports:
      - "8080:80"

volumes:
  db_data:
