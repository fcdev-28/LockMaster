services:
  db:
    image: mysql:8.0
    # Las credenciales vienen de .env.local, que no se versiona. Copia la
    # plantilla antes de levantar nada: cp .env.local.dist .env.local
    env_file:
      - .env.local
    # Solo desde esta máquina: el puerto no se abre a la red local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Secretos y credenciales, igual que en db: cp .env.local.dist .env.local
    env_file:
      - .env.local
    environment:
      APP_ENV: dev
      JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
      JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
      LOAD_FIXTURES: "1"
    ports:
      - "8080:80"

volumes:
  db_data:
