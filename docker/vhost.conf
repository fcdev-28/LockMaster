<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Apache no expone la cabecera Authorization en $_SERVER, y Symfony solo mira
    # ahí (ServerBag lee HTTP_AUTHORIZATION y REDIRECT_HTTP_AUTHORIZATION, nada más).
    # Sin esto el token JWT se ignora y /api/access/check responde 'Not authenticated'.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    # Debian define 'Alias /icons/ /usr/share/apache2/icons/' en mods-enabled/alias.conf
    # y eso tapa public/icons/, donde vive la fuente icomoon del proyecto.
    # Lo redefinimos para este vhost.
    Alias /icons/ /var/www/html/public/icons/

    <Directory /var/www/html/public/bundles>
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
